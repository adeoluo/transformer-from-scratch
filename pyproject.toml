[project]
name = "transformer-from-scratch"
version = "0.2.1"
description = "A transformer language model and a reverse-mode autodiff engine built from scratch in Python, with no numerical libraries"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Optional, opt-in only: the independent PyTorch numerical-parity check in
# tests/test_torch_parity.py. Not installed by default CI and not a runtime
# dependency. Run it with: uv sync --group validation && uv run pytest
validation = [
    "torch>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformer_from_scratch"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["transformer_from_scratch"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "slow: long-running end-to-end checks (deselect with -m \"not slow\")",
]

[tool.coverage.run]
source = ["src"]
branch = true
